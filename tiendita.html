<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>MI PRIMERA VEZ CON JAVASCRIPT</title>
</head>
<body>

<nav class="navbar fg-2 bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">
      <img src="img/tiendita.webp" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
      TIENDITA
    </a>
  </div>
</nav>

<div class="container p-4 bg-inverse mt-5 card">
  <h1 class="text-center fg-black">TIENDITA</h1><hr>
  <div class="d-flex justify-content-end">
  <button type="button" class="btn-solid btn-styled theme-danger w-25" data-bs-toggle="dialog" data-bs-target="#addProducto"><i class="bi bi-file-plus"></i>Agregar</button>
   </div> 
  <table class="table table-striped table-hover mt-3">
    <tr class="text-center">
      <td>PRODUCTO</td>
      <td>PRECIO</td>
      <td>STOCK</td>
      <td>ACTION</td>
    </tr>
    <tbody id="productos"></tbody>


      </tbody> 
  </table>


</div>


<dialog class="dialog" id="addProducto">
  <div class="dialog-header">
    <h1 class="dialog-title">AGREGAR PRODUCTO</h1>
    <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
  </div>
  <div class="dialog-body">
    <h3>NOMBRE</h3>
    <input type="text" id="nombre" class="form-control"><br>
    <h3>PRECIO</h3>
    <input type="text" id="precio" class="form-control"><br>

    <h3>STOCK</h3>
    <input type="number" id="stock" class="form-control"><br>

  </div>
  <div class="dialog-footer">
   <button type="button" class="btn-solid theme-danger" onclick="document.getElementById('addProducto').close()"><i class="bi bi-x-square"></i>Cancelar</button>
    <button type="button" class="btn-solid theme-success" id="btnSave"><i class="bi bi-arrow-bar-down"></i>Guardar</button>
  </div>
</dialog>


<dialog class="dialog" id="editProducto">
  <div class="dialog-header">
    <h1 class="dialog-title">EDITAR PRODUCTO</h1>
    <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
  </div>
  <div class="dialog-body">
    <h3>NOMBRE</h3>
    <input type="text" id="nombree" class="form-control"><br>
    <h3>PRECIO</h3>
    <input type="text" id="precioe" class="form-control"><br>

    <h3>STOCK</h3>
    <input type="number" id="stocke" class="form-control"><br>

  </div>
  <div class="dialog-footer">
    <input type="hidden" name="posicion" id="posicion">
    <button type="button" class="btn-solid theme-danger" onclick="document.getElementById('editProducto').close()"><i class="bi bi-x-square"></i>Cancelar</button>
    <button type="button" class="btn-solid theme-success" id="btnEdit"><i class="bi bi-arrow-bar-down"></i>Guardar</button>
  </div>
</dialog>



   <script src="js/sweetalert2.all.min.js"></script>
   <script src="js/tiendita.js"></script>
   <script type="module" src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
